services:
  - type: web
    name: househunt-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://househunt-smartbridge.netlify.app
      - key: ADMIN_EMAIL
        value: admin@househunt.com
      - key: ADMIN_PASSWORD
        sync: false
